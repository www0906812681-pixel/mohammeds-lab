<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - مختبر محمد</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; text-align: center; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; max-width: 400px; margin: 40px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        input { padding: 10px; width: 85%; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; margin-bottom: 12px; text-align: center; }
        button { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 90%; }
        button:hover { background: #2563eb; }
        .hidden { display: none; }
        .switch-box { display: flex; justify-content: space-between; align-items: center; background: #334155; padding: 10px 15px; border-radius: 8px; margin: 10px 0; }
        .status-on { color: #22c55e; font-weight: bold; }
        .status-off { color: #ef4444; font-weight: bold; }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" class="card">
        <h2>🔒 دخول المشرف</h2>
        <p style="font-size: 13px; color: #94a3b8;">أدخل كلمة المرور فقط للتحكم</p>
        
        <input type="password" id="password" placeholder="كلمة المرور (admin)">
        
        <button onclick="checkLogin()">دخول للوحة التحكم</button>
        <p id="error-msg" style="color: #ef4444; margin-top: 10px; font-size: 13px;"></p>
    </div>

    <!-- لوحة التحكم الفعلية -->
    <div id="admin-panel" class="card hidden">
        <h2>🎛️ لوحة تحكم الموقع</h2>
        <p>تحكم في تشغيل وإيقاف أقسام ومشاريع موقعك</p>
        
        <div class="switch-box">
            <span>لعبة التحدي:</span>
            <span id="game-status-text" class="status-on">جار التحميل...</span>
            <button style="width: auto;" onclick="toggleStatus('game')">تغيير</button>
        </div>

        <div class="switch-box">
            <span>الآلة الحاسبة:</span>
            <span id="calc-status-text" class="status-on">جار التحميل...</span>
            <button style="width: auto;" onclick="toggleStatus('calc')">تغيير</button>
        </div>
        
        <button onclick="logout()" style="background: #ef4444; margin-top: 20px;">تسجيل الخروج</button>
    </div>

    <script>
        const correctHash = "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918"; 
        const WORKER_URL = "https://mohammeds-lab-worker.mohammeds-lab.workers.dev";

        let isLoggedIn = sessionStorage.getItem('is_admin_logged') === "true";
        let currentConfig = { game_status: true, calculator_status: true };
        let fileSha = "";

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        window.onload = function() {
            if (isLoggedIn) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                loadConfigStatus();
            }
        };

        async function checkLogin() {
            const pass = document.getElementById('password').value;
            const hash = await sha256(pass);
            
            if (hash === correctHash) {
                isLoggedIn = true;
                sessionStorage.setItem('is_admin_logged', "true");
                
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                loadConfigStatus();
            } else {
                document.getElementById('error-msg').innerText = "كلمة المرور غير صحيحة!";
            }
        }

        async function loadConfigStatus() {
            try {
                let res = await fetch(WORKER_URL);
                if (!res.ok) throw new Error("Worker Error");
                
                let data = await res.json();
                fileSha = data.sha;
                let decodedContent = JSON.parse(decodeURIComponent(escape(atob(data.content))));
                currentConfig = decodedContent;
                updateUI();
            } catch (e) {
                alert("فشل الاتصال بالسيرفر الوسيط! تأكد من إعدادات Cloudflare.");
            }
        }

        function updateUI() {
            document.getElementById('game-status-text').innerText = currentConfig.game_status ? "شغال ✅" : "موقف ❌";
            document.getElementById('game-status-text').className = currentConfig.game_status ? "status-on" : "status-off";

            document.getElementById('calc-status-text').innerText = currentConfig.calculator_status ? "شغال ✅" : "موقف ❌";
            document.getElementById('calc-status-text').className = currentConfig.calculator_status ? "status-on" : "status-off";
        }

        async function toggleStatus(type) {
            if (type === 'game') currentConfig.game_status = !currentConfig.game_status;
            if (type === 'calc') currentConfig.calculator_status = !currentConfig.calculator_status;
            
            updateUI();
            
            try {
                let jsonString = JSON.stringify(currentConfig, null, 2);
                let encodedContent = btoa(unescape(encodeURIComponent(jsonString)));

                let response = await fetch(WORKER_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        content: encodedContent,
                        sha: fileSha
                    })
                });

                if (response.ok) {
                    let result = await response.json();
                    fileSha = result.content.sha;
                    alert("تم حفظ التعديل بنجاح في الموقع! 🚀");
                } else {
                    alert("فشل الحفظ عبر السيرفر!");
                }
            } catch (err) {
                alert("حدث خطأ أثناء الاتصال بالسيرفر!");
            }
        }

        function logout() {
            sessionStorage.removeItem('is_admin_logged');
            location.reload();
        }
    </script>
</body>
</html>
