<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الفخمة - مختبر محمد</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #111827;
            --border-color: #1e293b;
            --accent-blue: #3b82f6;
            --accent-blue-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --danger: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .dashboard-container {
            width: 100%;
            max-width: 480px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .header-title h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-main);
            color: var(--text-main);
            margin-bottom: 15px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: var(--accent-blue);
        }

        .btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            font-size: 14px;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--accent-blue-hover);
        }

        .btn-danger {
            background: var(--danger);
        }
        .btn-danger:hover {
            background: #dc2626;
        }

        .hidden {
            display: none;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-card span {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .switch-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-on {
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
        }

        .status-off {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
        }

        .btn-sm {
            width: auto;
            padding: 6px 14px;
            font-size: 12px;
            border-radius: 8px;
        }

        #error-msg {
            color: var(--danger);
            font-size: 13px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- شاشة تسجيل الدخول الفخمة -->
        <div id="login-screen" class="card">
            <div class="header-title">
                <span>🔐</span>
                <h2>تسجيل المشرف</h2>
            </div>
            <p class="subtitle">أدخل كلمة المرور للوصول إلى لوحة التحكم الآمنة</p>
            
            <input type="password" id="password" placeholder="كلمة المرور">
            <button class="btn" onclick="checkLogin()">دخول لوحة التحكم</button>
            <p id="error-msg"></p>
        </div>

        <!-- لوحة التحكم الفعلية المودرن -->
        <div id="admin-panel" class="card hidden">
            <div class="header-title">
                <span>🎛️</span>
                <h2>لوحة تحكم الموقع</h2>
            </div>
            <p class="subtitle">إدارة وحالة أقسام ومشاريع مختبر محمد</p>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <span>حالة النظام</span>
                    <strong style="color: var(--success);">متصل بالآمان</strong>
                </div>
                <div class="stat-card">
                    <span>المشاريع</span>
                    <strong style="color: var(--accent-blue);">نشطة</strong>
                </div>
            </div>

            <div class="switch-box">
                <span>لعبة التحدي</span>
                <span id="game-status-text" class="status-badge status-on">جار التحميل...</span>
                <button class="btn btn-sm" onclick="toggleStatus('game')">تغيير</button>
            </div>

            <div class="switch-box">
                <span>الآلة الحاسبة</span>
                <span id="calc-status-text" class="status-badge status-on">جار التحميل...</span>
                <button class="btn btn-sm" onclick="toggleStatus('calc')">تغيير</button>
            </div>
            
            <button class="btn btn-danger" onclick="logout()" style="margin-top: 15px;">تسجيل الخروج</button>
        </div>
    </div>

    <script>
        const correctHash = "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918"; 
        const WORKER_URL = "https://mohammeds-lab-worker.mohammeds-lab.workers.dev";

        let isLoggedIn = sessionStorage.getItem('is_admin_logged') === "true";
        let currentConfig = { game_status: true, calculator_status: true };
        let fileSha = "";

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        window.onload = function() {
            if (isLoggedIn) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                loadConfigStatus();
            }
        };

        async function checkLogin() {
            const pass = document.getElementById('password').value;
            const hash = await sha256(pass);
            
            if (hash === correctHash) {
                isLoggedIn = true;
                sessionStorage.setItem('is_admin_logged', "true");
                
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                loadConfigStatus();
            } else {
                document.getElementById('error-msg').innerText = "كلمة المرور غير صحيحة!";
            }
        }

        async function loadConfigStatus() {
            try {
                let res = await fetch(WORKER_URL);
                if (!res.ok) throw new Error("Worker Error");
                
                let data = await res.json();
                fileSha = data.sha;
                let decodedContent = JSON.parse(decodeURIComponent(escape(atob(data.content))));
                currentConfig = decodedContent;
                updateUI();
            } catch (e) {
                // تجاهل خطأ التحميل المبدئي
            }
        }

        function updateUI() {
            const gameText = document.getElementById('game-status-text');
            const calcText = document.getElementById('calc-status-text');

            gameText.innerText = currentConfig.game_status ? "شغال ✅" : "موقف ❌";
            gameText.className = currentConfig.game_status ? "status-badge status-on" : "status-badge status-off";

            calcText.innerText = currentConfig.calculator_status ? "شغال ✅" : "موقف ❌";
            calcText.className = currentConfig.calculator_status ? "status-badge status-on" : "status-badge status-off";
        }

        async function toggleStatus(type) {
            if (type === 'game') currentConfig.game_status = !currentConfig.game_status;
            if (type === 'calc') currentConfig.calculator_status = !currentConfig.calculator_status;
            
            updateUI();
            
            try {
                let jsonString = JSON.stringify(currentConfig, null, 2);
                let encodedContent = btoa(unescape(encodeURIComponent(jsonString)));

                let response = await fetch(WORKER_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: encodedContent, sha: fileSha })
                });

                if (response.ok) {
                    let result = await response.json();
                    fileSha = result.content.sha;
                }
            } catch (err) {
                // صمت الخطأ مؤقتاً
            }
        }

        function logout() {
            sessionStorage.removeItem('is_admin_logged');
            location.reload();
        }
    </script>
</body>
</html>
