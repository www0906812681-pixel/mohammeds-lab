<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الاحترافية - مختبر محمد</title>
    <style>
        :root {
            --bg-main: #090d16;
            --bg-sidebar: #0e1626;
            --bg-card: #131c31;
            --border-color: #1e293b;
            --accent-blue: #3b82f6;
            --accent-blue-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --danger: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .admin-layout {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 520px;
            background: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
            overflow: hidden;
        }

        /* رأس اللوحة الفخم */
        .top-bar {
            background: var(--bg-card);
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-bar h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .top-bar span {
            font-size: 12px;
            color: var(--text-muted);
        }

        .content-body {
            padding: 20px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 14px;
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-main);
            color: var(--text-main);
            margin-bottom: 15px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: var(--accent-blue);
        }

        .btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            font-size: 14px;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--accent-blue-hover);
        }

        .btn-danger {
            background: var(--danger);
        }
        .btn-danger:hover {
            background: #dc2626;
        }

        .hidden {
            display: none !important;
        }

        /* إحصائيات سريعة متجاورة فخمة */
        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }

        .mini-stat {
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }

        .mini-stat span {
            font-size: 11px;
            color: var(--text-muted);
            display: block;
            margin-bottom: 4px;
        }

        .mini-stat strong {
            font-size: 14px;
        }

        /* صناديق التحكم الفخمة */
        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .control-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .control-info span {
            font-weight: 600;
            font-size: 14px;
        }

        .status-badge {
            font-size: 11px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 6px;
            width: fit-content;
        }

        .status-on {
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
        }

        .status-off {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
        }

        .btn-sm {
            width: auto;
            padding: 8px 16px;
            font-size: 12px;
            border-radius: 8px;
        }

        #error-msg {
            color: var(--danger);
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="admin-layout">
        <!-- شاشة تسجيل الدخول -->
        <div id="login-screen" class="content-body">
            <div class="card" style="margin-bottom: 0;">
                <h2 style="margin-top: 0; margin-bottom: 6px;">🔐 تسجيل المشرف</h2>
                <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 20px;">أدخل كلمة المرور للوصول للوحة التحكم الفخمة</p>
                
                <input type="password" id="password" placeholder="كلمة المرور">
                <button class="btn" onclick="checkLogin()">دخول آمن</button>
                <p id="error-msg"></p>
            </div>
        </div>

        <!-- لوحة التحكم الحقيقية الفخمة -->
        <div id="admin-panel" class="hidden">
            <div class="top-bar">
                <h2>🎛️ لوحة تحكم الموقع</h2>
                <span>مختبر محمد</span>
            </div>

            <div class="content-body">
                <div class="stats-row">
                    <div class="mini-stat">
                        <span>حالة الحماية</span>
                        <strong style="color: var(--success);">مرتبط بالوسيط</strong>
                    </div>
                    <div class="mini-stat">
                        <span>إدارة المشاريع</span>
                        <strong style="color: var(--accent-blue);">نشطة وكاملة</strong>
                    </div>
                </div>

                <div class="control-row">
                    <div class="control-info">
                        <span>لعبة التحدي</span>
                        <span id="game-status-text" class="status-badge status-on">جار التحميل...</span>
                    </div>
                    <button class="btn btn-sm" onclick="toggleStatus('game')">تغيير</button>
                </div>

                <div class="control-row">
                    <div class="control-info">
                        <span>الآلة الحاسبة</span>
                        <span id="calc-status-text" class="status-badge status-on">جار التحميل...</span>
                    </div>
                    <button class="btn btn-sm" onclick="toggleStatus('calc')">تغيير</button>
                </div>
                
                <button class="btn btn-danger btn-sm" onclick="logout()" style="width: 100%; margin-top: 15px;">تسجيل الخروج</button>
            </div>
        </div>
    </div>

    <script>
        const correctHash = "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918"; 
        const WORKER_URL = "https://mohammeds-lab-worker.mohammeds-lab.workers.dev";

        let isLoggedIn = sessionStorage.getItem('is_admin_logged') === "true";
        let currentConfig = { game_status: true, calculator_status: true };
        let fileSha = "";

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        window.onload = function() {
            if (isLoggedIn) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                loadConfigStatus();
            }
        };

        async function checkLogin() {
            const pass = document.getElementById('password').value;
            const hash = await sha256(pass);
            
            if (hash === correctHash) {
                isLoggedIn = true;
                sessionStorage.setItem('is_admin_logged', "true");
                
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                loadConfigStatus();
            } else {
                document.getElementById('error-msg').innerText = "كلمة المرور غير صحيحة!";
            }
        }

        async function loadConfigStatus() {
            try {
                let res = await fetch(WORKER_URL);
                if (!res.ok) throw new Error("Worker Error");
                
                let data = await res.json();
                fileSha = data.sha;
                let decodedContent = JSON.parse(decodeURIComponent(escape(atob(data.content))));
                currentConfig = decodedContent;
                updateUI();
            } catch (e) {}
        }

        function updateUI() {
            const gameText = document.getElementById('game-status-text');
            const calcText = document.getElementById('calc-status-text');

            gameText.innerText = currentConfig.game_status ? "شغال ✅" : "موقف ❌";
            gameText.className = currentConfig.game_status ? "status-badge status-on" : "status-badge status-off";

            calcText.innerText = currentConfig.calculator_status ? "شغال ✅" : "موقف ❌";
            calcText.className = currentConfig.calculator_status ? "status-badge status-on" : "status-badge status-off";
        }

        async function toggleStatus(type) {
            if (type === 'game') currentConfig.game_status = !currentConfig.game_status;
            if (type === 'calc') currentConfig.calculator_status = !currentConfig.calculator_status;
            
            updateUI();
            
            try {
                let jsonString = JSON.stringify(currentConfig, null, 2);
                let encodedContent = btoa(unescape(encodeURIComponent(jsonString)));

                let response = await fetch(WORKER_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: encodedContent, sha: fileSha })
                });

                if (response.ok) {
                    let result = await response.json();
                    fileSha = result.content.sha;
                }
            } catch (err) {}
        }

        function logout() {
            sessionStorage.removeItem('is_admin_logged');
            location.reload();
        }
    </script>
</body>
</html>
