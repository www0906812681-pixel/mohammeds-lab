<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - مختبر محمد</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; text-align: center; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; max-width: 400px; margin: 40px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        input { padding: 10px; width: 80%; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; margin-bottom: 15px; }
        button { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2563eb; }
        .hidden { display: none; }
        .switch-box { display: flex; justify-content: space-between; align-items: center; background: #334155; padding: 10px 15px; border-radius: 8px; margin: 10px 0; }
        .status-on { color: #22c55e; font-weight: bold; }
        .status-off { color: #ef4444; font-weight: bold; }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" class="card">
        <h2>🔒 دخول المشرف</h2>
        <p>الرجاء إدخال كلمة المرور للوصول للوحة التحكم</p>
        <input type="password" id="password" placeholder="كلمة المرور">
        <br>
        <button onclick="checkLogin()">دخول</button>
        <p id="error-msg" style="color: #ef4444; margin-top: 10px;"></p>
    </div>

    <!-- لوحة التحكم الفعلية -->
    <div id="admin-panel" class="card hidden">
        <h2>🎛️ لوحة تحكم الموقع</h2>
        <p>تحكم في تشغيل وإيقاف أقسام ومشاريع موقعك</p>
        
        <div class="switch-box">
            <span>لعبة التحدي:</span>
            <span id="game-status-text" class="status-on">جار التحميل...</span>
            <button onclick="toggleStatus('game')">تغيير الحالة</button>
        </div>

        <div class="switch-box">
            <span>الآلة الحاسبة:</span>
            <span id="calc-status-text" class="status-on">جار التحميل...</span>
            <button onclick="toggleStatus('calc')">تغيير الحالة</button>
        </div>
        
        <p style="font-size: 12px; color: #94a3b8; margin-top: 20px;">ملاحظة: التعديلات سيتم حفظها وربطها بالموقع فوراً.</p>
    </div>

    <script>
        // كلمة السر المشفرة الخاصة بـ admin
        const correctHash = "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918";

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function checkLogin() {
            const pass = document.getElementById('password').value;
            const hash = await sha256(pass);
            if (hash === correctHash) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                loadConfigStatus();
            } else {
                document.getElementById('error-msg').innerText = "كلمة المرور غير صحيحة!";
            }
        }

        let currentConfig = { game_status: true, calculator_status: true };

        async function loadConfigStatus() {
            try {
                let res = await fetch('config.json?' + new Date().getTime());
                currentConfig = await res.json();
                updateUI();
            } catch (e) {
                alert("فشل في تحميل الإعدادات");
            }
        }

        function updateUI() {
            document.getElementById('game-status-text').innerText = currentConfig.game_status ? "شغال ✅" : "موقف ❌";
            document.getElementById('game-status-text').className = currentConfig.game_status ? "status-on" : "status-off";

            document.getElementById('calc-status-text').innerText = currentConfig.calculator_status ? "شغال ✅" : "موقف ❌";
            document.getElementById('calc-status-text').className = currentConfig.calculator_status ? "status-on" : "status-off";
        }

        function toggleStatus(type) {
            if (type === 'game') currentConfig.game_status = !currentConfig.game_status;
            if (type === 'calc') currentConfig.calculator_status = !currentConfig.calculator_status;
            updateUI();
            alert("تم تغيير الحالة محلياً! في الخطوة القادمة سنربطها بيتاً ليتم الحفظ التلقائي في جيت هاب.");
        }
    </script>
</body>
</html>
