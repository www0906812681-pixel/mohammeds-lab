<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">مختبر محمد | Mohammed's Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b1329;
            --card-bg: #131c35;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.4);
            --border-color: rgba(56, 189, 248, 0.3);
            --browser-bg: #1e293b;
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #475569;
            --primary: #0284c7;
            --primary-glow: rgba(2, 132, 199, 0.2);
            --border-color: rgba(2, 132, 199, 0.3);
            --browser-bg: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: linear-gradient(rgba(11, 19, 41, 0.88), rgba(11, 19, 41, 0.92)), 
                        url('https://images.unsplash.com/photo-1555066931-4365d14bab8c?q=80&w=1000&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .browser-window {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .browser-header {
            background: var(--browser-bg);
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .browser-dots {
            display: flex;
            gap: 6px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .dot-red { background: #ef4444; }
        .dot-yellow { background: #f59e0b; }
        .dot-green { background: #10b981; }

        .browser-url-bar {
            background: var(--bg-color);
            color: var(--text-muted);
            padding: 4px 15px;
            border-radius: 15px;
            font-size: 0.8rem;
            font-family: 'Fira Code', monospace;
            width: 50%;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .browser-controls {
            display: flex;
            gap: 8px;
        }

        .control-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .browser-content {
            padding: 20px;
            max-height: 82vh;
            overflow-y: auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        .ms-logo {
            width: 85px;
            height: 85px;
            background: linear-gradient(135deg, #2563eb, #38bdf8);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 34px;
            font-weight: 900;
            color: #ffffff;
            margin: 0 auto 12px auto;
            box-shadow: 0 0 20px var(--primary-glow);
            border: 3px solid rgba(255, 255, 255, 0.6);
            letter-spacing: -1px;
        }

        .title-frame {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 12px;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            box-shadow: 0 0 15px var(--primary-glow);
            margin-bottom: 8px;
        }

        h1 {
            color: var(--primary);
            font-size: 1.8rem;
            font-weight: 900;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .section-title {
            color: var(--text-color);
            font-size: 1.25rem;
            margin-bottom: 15px;
            border-bottom: 2px dashed var(--border-color);
            padding-bottom: 6px;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 15px;
        }

        .card {
            background: var(--bg-color);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .card h3 {
            color: var(--primary);
            font-size: 1.1rem;
            margin-bottom: 6px;
        }

        .card p {
            color: var(--text-muted);
            font-size: 0.88rem;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .btn-try {
            width: 100%;
            background: linear-gradient(135deg, #2563eb, #38bdf8);
            color: #ffffff;
            border: none;
            padding: 8px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }

        .modal-box {
            background: var(--card-bg);
            border: 2px solid var(--primary);
            border-radius: 14px;
            max-width: 380px;
            width: 100%;
            padding: 20px;
            position: relative;
        }

            position: absolute;
            top: 10px;
            left: 15
