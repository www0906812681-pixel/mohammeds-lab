<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>

        body {

        .top-bar {

            max-width: 800px;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }

        .lang-btn {
            background-color: #1e293b;
            color: #38bdf8;
            border: 1px solid #334155;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;

        }

        }

            margin-top: 10px;
            margin-bottom: 40px;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #2563eb, #38bdf8);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            margin: 0 auto 15px auto;
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.4);
        }

        h1 {
            color: #38bdf8;
            font-size: 2rem;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        .section-title {
            color: #f1f5f9;
            margin-bottom: 20px;
            border-bottom: 2px solid #1e293b;
            padding-bottom: 10px;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: #1e293b;
            border: 1px solid #334155;

            padding: 20px;

            margin-bottom: 10px;
        }

        .card h3 {

            margin-bottom: 10px;
