<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">مختبر محمد | Mohammed's Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b1329;
            --card-bg: rgba(19, 28, 53, 0.85);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.4);
            --border-color: rgba(56, 189, 248, 0.3);
            --browser-bg: #1e293b;
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-color: #0f172a;
            --text-muted: #475569;
            --primary: #0284c7;
            --primary-glow: rgba(2, 132, 199, 0.2);
            --border-color: rgba(2, 132, 199, 0.3);
            --browser-bg: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body {
            background: linear-gradient(rgba(11, 19, 41, 0.92), rgba(11, 19, 41, 0.95)), 
                        url('https://images.unsplash.com/photo-1555066931-4365d14bab8c?q=80&w=1000&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        /* Chrome Browser Window Frame */
        .browser-window {
            width: 100%;
            max-width: 880px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 2px solid var(--border-color);
            border-radius: 14px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Browser Header Bar */
        .browser-header {
            background: var(--browser-bg);
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .browser-dots {
            display: flex;
            gap: 6px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .dot-red { background: #ef4444; }
        .dot-yellow { background: #f59e0b; }
        .dot-green { background: #10b981; }

        .browser-url-bar {
            background: var(--bg-color);
            color: var(--text-muted);
            padding: 5px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-family: 'Fira Code', monospace;
            width: 55%;
            text-align: center;
            border: 1px solid var(--border-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .browser-controls {
            display: flex;
            gap: 10px;
        }

        .control-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 4px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .control-btn:hover {
            background: var(--primary);
            color: #fff;
        }

        /* Browser Body Content */
        .browser-content {
            padding: 25px;
            max-height: 85vh;
            overflow-y: auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        /* Custom MS Logo */
        .ms-logo {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #2563eb, #38bdf8);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 38px;
            font-weight: 900;
            color: #ffffff;
            margin: 0 auto 15px auto;
            box-shadow: 0 0 25px var(--primary-glow);
            border: 3px solid rgba(255, 255, 255, 0.6);
            font-family: 'Poppins', sans-serif;
            letter-spacing: -2px;
        }

        .title-frame {
            display: inline-block;
            padding: 10px 24px;
            border-radius: 14px;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            box-shadow: 0 0 20px var(--primary-glow);
            margin-bottom: 10px;
        }

        h1 {
            color: var(--primary);
            font-size: 2rem;
            font-weight: 900;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.05rem;
            font-weight: 600;
        }

        /* Projects Grid */
        .section-title {
            color: var(--text-color);
            font-size: 1.35rem;
            margin-bottom: 20px;
            border-bottom: 2px dashed var(--border-color);
            padding-bottom: 8px;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 18px;
        }

        .card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 8px 25px var(--primary-glow);
        }

        .card-icon {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .card h3 {
            color: var(--primary);
            font-size: 1.15rem;
            margin-bottom: 8px;
        }

        .card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .btn-try {
            width: 100%;
            background: linear-gradient(135deg, #2563eb, #38bdf8);
            color: #ffffff;
            border: none;
            padding: 9px 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
        }

        .btn-try:hover {
            opacity: 0.9;
        }

        /* Modal Box */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-box {
            background: var(--card-bg);
            border: 2px solid var(--primary);
            border-radius: 16px;
            max-width: 400px;
            width: 100%;
            padding: 22px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .close-btn {
            position: absolute;
            top: 10px;
            left: 15px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 22px;
            cursor: pointer;
        }
        [dir="ltr"] .close-btn { left: auto; right: 15px; }

        .modal-box h3 {
            color: var(--primary);
            margin-bottom: 15px;
        }

        .tool-input-group {
            margin-bottom: 12px;
            text-align: right;
        }
        [dir="ltr"] .tool-input-group { text-align: left; }

        .tool-input-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .tool-input-group input {
            width: 100%;
            padding: 9px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 0.95rem;
        }

        .tool-result {
            margin-top: 12px;
            padding: 10px;
            background: var(--bg-color);
            border-radius: 8px;
            border: 1px dashed var(--primary);
            color: #10b981;
            font-weight: 700;
            text-align: center;
            display: none;
        }

        /* Advanced Calculator Styling */
        .calc-screen {
            background: var(--bg-color);
            color: var(--primary);
            font-size: 1.5rem;
            padding: 12px;
            border-radius: 8px;
            text-align: left;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            font-family: 'Fira Code', monospace;
            min-height: 50px;
            word-break: break-all;
        }
        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .calc-btn {
            background: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 12px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .calc-btn:hover { background: var(--primary); color: #fff; }

        footer {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.85rem;
            text-align: center;
        }
    </style>
</head>
